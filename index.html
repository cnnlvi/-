<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=2340, user-scalable=no">
    <title>Valentine's Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 1080px;
            height: 2340px;
            overflow: hidden;
            background-color: #ffdde1;
            color: #d63384;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #gif-container img {
            max-width: 80%;
            height: auto;
            border-radius: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .btn {
            font-size: 1.5rem;
            padding: 10px;
            background-color: #ff4081;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1 id="question">Will you be my Valentine?</h1>
    <div id="gif-container">
        <img id="gif" src="dob-dob-dob-rizz.gif" alt="gif">
    </div>
    <div class="button-container" id="buttons">
        <button id="yes" class="btn" onclick="goToFinalMessage()">YES</button>
        <button id="no" class="btn" onclick="nextQuestion()">NO</button>
    </div>

    <script>
        const questions = [
            "Will you be my Valentine?",
            "Are you sure?",
            "Really really sure?",
            "Why no? Please??",
            "Please, please, pleasee???",
            "Pretty please?????????",
            "Even if I'm begging you to??? :'(",
            "I'm begging you my princess??? :((((((",
            "My cootiepatootie sweet princess????? T^T",
        ];
        
        const gifs = [
            "dob-dob-dob-rizz.gif",
            "cat-2.jpg",
            "cat-3.jpg",
            "cat-4.jpg",
            "cat-5.jpg",
            "cat-6.jpg",
            "cat-7.jpg",
            "cat-8.jpg",
            "cat-9.jpg",
            "howls-moving-castle-surprise-hug.gif"
        ];
        
        let currentQuestion = 0;
        const questionText = document.getElementById("question");
        const gifImg = document.getElementById("gif");
        const buttonContainer = document.getElementById("buttons");
        const noButton = document.getElementById("no");

        function preloadImages() {
            gifs.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }
        
        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                questionText.textContent = questions[currentQuestion];
                gifImg.src = gifs[currentQuestion];
                
                // Remove NO button for last question
                if (currentQuestion === questions.length - 1) {
                    noButton.style.display = "none";
                }
            } else {
                goToFinalMessage();
            }
        }
        
        function goToFinalMessage() {
            document.body.innerHTML = '<h1>Thank you, I love you so much pookie <3</h1>' +
                                      '<img src="' + gifs[9] + '" alt="final gif" style="width: 80%;">';
        }
        
        preloadImages();
    </script>
</body>
</html>
